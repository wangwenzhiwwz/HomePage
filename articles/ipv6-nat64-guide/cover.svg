<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="IPv6 NAT64 network bridge">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9f1f2"/><stop offset=".48" stop-color="#8cc9e5"/><stop offset="1" stop-color="#596fa8"/></linearGradient>
 <linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54e0d0"/><stop offset=".52" stop-color="#4b9fe2"/><stop offset="1" stop-color="#777be8"/></linearGradient>
 <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72f0d2"/><stop offset=".5" stop-color="#d8faff"/><stop offset="1" stop-color="#a8a0ff"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#d3f8ff" stop-opacity=".18"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#b9c0c1" stop-opacity=".22"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#596164"/><stop offset="1" stop-color="#171d1f"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#6d777a" stop-opacity=".35"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <radialGradient id="light"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/><circle cx="220" cy="160" r="330" fill="#b9fff0" opacity=".35" filter="url(#blur)"/><circle cx="1370" cy="680" r="390" fill="#8b8cff" opacity=".34" filter="url(#blur)"/>
<circle cx="1260" cy="170" r="280" fill="url(#light)"/>
<ellipse cx="820" cy="760" rx="570" ry="75" fill="#586164" opacity=".22" filter="url(#blur)"/>

<g transform="translate(250 210)">
 <g fill="url(#accent)" stroke="#fff" stroke-width="4">
  <rect x="0" y="90" width="300" height="330" rx="34"/><rect x="800" y="90" width="300" height="330" rx="34"/>
 </g>
 <g fill="url(#node)"><circle cx="150" cy="205" r="68"/><circle cx="950" cy="205" r="68"/></g>
 <g fill="#f6f7f4" font-family="Arial" font-size="42" text-anchor="middle"><text x="150" y="220">IPv6</text><text x="950" y="220">IPv4</text></g>
 <path d="M300 255 C420 80 680 80 800 255" fill="none" stroke="url(#bridge)" stroke-width="34" stroke-linecap="round" opacity=".8"/>
 <path d="M300 255 C420 80 680 80 800 255" fill="none" stroke="#e9ffff" stroke-width="4" stroke-linecap="round"/>
 <rect x="440" y="155" width="220" height="190" rx="28" fill="url(#metal)" stroke="#fff" stroke-width="4"/>
 <g fill="#f5f6f2" font-family="Arial" text-anchor="middle"><text x="550" y="235" font-size="42">NAT64</text><text x="550" y="280" font-size="22">DNS64 · ROUTE</text></g>
</g>
<path d="M0 760 Q400 660 800 760 T1600 760 M0 792 Q400 692 800 792 T1600 792" fill="none" stroke="#fff" stroke-width="2" opacity=".38"/>
</svg>