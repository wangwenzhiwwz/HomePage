<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="IPv6 NAT64 network bridge">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f5f2"/><stop offset=".56" stop-color="#e4e6e4"/><stop offset="1" stop-color="#c9cece"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#b9c0c1" stop-opacity=".22"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#596164"/><stop offset="1" stop-color="#171d1f"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#6d777a" stop-opacity=".35"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
 <radialGradient id="light"><stop stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<circle cx="1260" cy="170" r="280" fill="url(#light)"/>
