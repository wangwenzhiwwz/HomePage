 <path d="M300 255 C420 80 680 80 800 255" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" opacity=".8"/>
 <path d="M300 255 C420 80 680 80 800 255" fill="none" stroke="#687477" stroke-width="4" stroke-linecap="round"/>
