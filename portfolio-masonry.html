            var systemIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = savedTheme ? savedTheme : (systemIsDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);

    <style>
        /* --- 核心设计系统 --- */
        :root { --transition-speed: 0.4s; --font-main: 'SF Pro Display', sans-serif; --font-mono: 'JetBrains Mono', monospace; }
        
        :root[data-theme="dark"] {
            --bg-body: #0a0a0a; --bg-gradient: radial-gradient(circle at 15% 50%, #1a1a1a 0%, #000000 100%);
            --text-primary: #ffffff; --text-secondary: #a0a0a0;
            --glass-bg: rgba(20, 20, 20, 0.65); --glass-border: rgba(255, 255, 255, 0.08);
            --accent-color: #0d6efd; --pill-bg: rgba(255, 255, 255, 0.1); --active-bg: rgba(255, 255, 255, 0.15);
        }
        :root[data-theme="light"] {
            --bg-body: #f0f2f5; --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --text-primary: #1a1a1a; --text-secondary: #555555;
            --glass-bg: rgba(255, 255, 255, 0.7); --glass-border: rgba(255, 255, 255, 0.4);
            --accent-color: #0d6efd; --pill-bg: rgba(0, 0, 0, 0.05); --active-bg: rgba(0, 0, 0, 0.08);
        }

        html { scroll-behavior: smooth; }
        body { font-family: var(--font-main); background: var(--bg-body); background-image: var(--bg-gradient); background-attachment: fixed; color: var(--text-primary); transition: background 0.5s ease, color 0.5s ease; }
        a { text-decoration: none; color: inherit; transition: 0.3s; }
        
        /* 鼠标优化 */
        * { cursor: auto; }
        .cursor-dot, .cursor-circle { display: none; }
        @media (pointer: fine) {
            * { cursor: none !important; }
            a, button, [role="button"], input, textarea, select { cursor: none !important; }
            .cursor-dot { display: block; position: fixed; top: 0; left: 0; width: 6px; height: 6px; background: var(--text-primary); border-radius: 50%; pointer-events: none; z-index: 9999; }
            .cursor-circle { display: block; position: fixed; top: 0; left: 0; width: 40px; height: 40px; border: 1px solid var(--text-secondary); opacity: 0.5; border-radius: 50%; pointer-events: none; z-index: 9999; transition: transform 0.1s ease-out, width 0.3s ease, height 0.3s ease, background 0.3s, opacity 0.3s; }
            body.hovering .cursor-circle { width: 50px; height: 50px; background: rgba(128,128,128,0.1); border-color: var(--text-primary); backdrop-filter: blur(1px); opacity: 0.8; }
        }

        /* --- 布局组件 --- */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 24px; }
        .glass-card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 20px; transition: 0.3s; height: 100%; position: relative; overflow: hidden; }
        .glass-card:hover { transform: translateY(-5px); border-color: var(--text-primary); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .sidebar { position: fixed; top: 30px; bottom: 30px; left: 30px; width: 290px; z-index: 100; padding: 40px 24px; display: flex; flex-direction: column; overflow-y: auto; scrollbar-width: none; }
        .main-content { margin-left: 350px; padding: 40px 60px 40px 0; min-height: 100vh; }

        /* 电脑端右上角独立按钮 */
        #theme-btn-desktop { 
            position: fixed; top: 30px; right: 40px; z-index: 10000;
            width: 44px; height: 44px; border-radius: 50%; 
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border);
            color: var(--text-primary); display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        #theme-btn-desktop:hover { transform: scale(1.1); background: var(--text-primary); color: var(--bg-body); }

        /* 移动端控制按钮 */
        .mobile-btn { 
            width: 36px; height: 36px; border-radius: 10px; 
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border); 
            color: var(--text-secondary); display: flex; align-items: center; justify-content: center; 
            transition: 0.2s; cursor: pointer;
        }
        .mobile-btn:hover, .mobile-btn:active { background: var(--text-primary); color: var(--bg-body); }

        /* Sidebar Header */
        .sidebar-header { text-align: center; margin-bottom: 20px; width: 100%; }
        .sidebar-logo-img { max-width: 160px; height: auto; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto; }
        
        .nav-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; margin: 25px 0 10px 10px; opacity: 0.5; font-weight: 700; }
        .nav-menu { list-style: none; padding: 0; margin: 0; }
        .nav-link { color: var(--text-secondary); font-weight: 600; padding: 10px 14px; border-radius: 12px; display: flex; align-items: center; gap: 12px; transition: 0.3s; margin-bottom: 5px; font-size: 0.9rem; }
        .nav-link:hover { color: var(--text-primary); background: var(--pill-bg); transform: translateX(4px); }
        .nav-link.active { color: var(--text-primary); background: var(--active-bg); }
        .badge-pro { background: var(--accent-color); color: #fff; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; margin-left: auto; font-family: var(--font-mono); }

        .social-dock { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: auto; padding-top: 30px; border-top: 1px solid var(--glass-border); }
        .social-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-border); color: var(--text-secondary); transition: 0.3s; }
        .social-icon:hover { background: var(--text-primary); color: var(--bg-body); transform: translateY(-3px); }

        /* --- Masonry Portfolio Styles --- */
        .page-title h1 { font-weight: 800; font-size: 3rem; color: var(--text-primary); }
        
        /* 筛选按钮组 */
        .filter-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            transition: 0.3s;
            cursor: pointer;
            text-decoration: none;
        }
        .filter-btn:hover, .filter-btn.is-checked {
            background: var(--text-primary);
            color: var(--bg-body);
            border-color: var(--text-primary);
        }

        /* 玻璃卡片优化 */
        .portfolio-item .glass-card {
            padding: 0;
            overflow: hidden;
            border-radius: 12px;
            cursor: zoom-in; /* 提示可点击放大 */
        }
        .portfolio-item img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s ease;
        }
        .portfolio-item:hover img {
            transform: scale(1.05);

        #imagePreviewModal .modal-content { background: rgba(0,0,0,0.9); border: none; width: 100%; height: 100%; }
        #imagePreviewModal .modal-body { display: flex; align-items: center; justify-content: center; padding: 0; width: 100%; height: 100%; cursor: zoom-out; }
        #imagePreviewModal img { width: 100%; height: 100%; object-fit: contain; max-width: 95vw; max-height: 95vh; transition: transform 0.3s; }
        
        @media (max-width: 991px) {
            .sidebar { position: relative; width: 100%; top: 0; left: 0; bottom: auto; margin-bottom: 30px; padding: 20px; border-radius: 0 0 24px 24px; height: auto; overflow: visible; display: block; }
            .main-content { margin-left: 0; padding: 20px; }
            .sidebar-header { display: flex; align-items: center; text-align: left; margin-bottom: 0; }

            .sidebar-content.show { max-height: 1000px; opacity: 1; margin-top: 20px; padding-top: 10px; border-top: 1px solid var(--glass-border); }
            .social-dock { padding-top: 20px; margin-top: 20px; }
        }

        #loader { position: fixed; inset: 0; background: var(--bg-body); z-index: 10000; display: flex; justify-content: center; align-items: center; transition: 0.5s; }
    </style>
</head>

    <script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
    
    <script>
        window.addEventListener('load', () => { 
            document.getElementById('loader').style.display='none'; 
            
            // 初始化 Isotope 瀑布流
            var iso = new Isotope( '.grid', {
                itemSelector: '.portfolio-item',
                layoutMode: 'fitRows' // 或者 'masonry'
            });

            // 绑定筛选按钮点击事件
            var filters = document.querySelectorAll('#filters .filter-btn');
            filters.forEach( btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    // 移除所有激活状态
                    filters.forEach(f => f.classList.remove('is-checked'));
                    // 激活当前按钮
                    e.target.classList.add('is-checked');
                    
                    // 获取筛选值并执行
                    var filterValue = e.target.getAttribute('data-filter');
                    iso.arrange({ filter: filterValue });
                });
            });
        });
        
        // 鼠标跟随
        if (window.matchMedia("(pointer: fine)").matches) {
            const dot = document.querySelector('.cursor-dot'), circle = document.querySelector('.cursor-circle');
            let mx=0, my=0, cx=0, cy=0;
            document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; dot.style.left=mx+'px'; dot.style.top=my+'px'; });
            function animate() { cx+=(mx-cx)*0.15; cy+=(my-cy)*0.15; circle.style.left=cx+'px'; circle.style.top=cy+'px'; requestAnimationFrame(animate); }
            animate();
            document.querySelectorAll('[data-hover]').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });
        }

        // --- 主题控制逻辑 ---
        const desktopBtn = document.getElementById('theme-btn-desktop');
        const mobileBtn = document.getElementById('theme-btn-mobile');
        
        let isDark = document.documentElement.getAttribute('data-theme') === 'dark';

        const updateIcons = () => {
            const iconHtml = isDark ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
            if(desktopBtn) desktopBtn.innerHTML = iconHtml;
            if(mobileBtn) mobileBtn.innerHTML = iconHtml;
        };
        updateIcons();

        function toggleTheme() {
            isDark = !isDark;
            const newTheme = isDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcons();
        }

        if(desktopBtn) desktopBtn.addEventListener('click', toggleTheme);
        if(mobileBtn) mobileBtn.addEventListener('click', toggleTheme);

        // 系统主题跟随
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            isDark = e.matches;
            const newTheme = isDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcons();
        });

        // 移动端菜单
        const mobileToggle = document.getElementById('mobile-toggle'), sidebarContent = document.getElementById('sidebar-content');
        mobileToggle.addEventListener('click', () => {
            sidebarContent.classList.toggle('show');
            mobileToggle.querySelector('i').classList.toggle('fa-xmark');
            mobileToggle.querySelector('i').classList.toggle('fa-bars');
        });
        const closeMenu = () => { if(window.innerWidth < 992 && sidebarContent.classList.contains('show')) mobileToggle.click(); };
        document.querySelectorAll('.nav-link').forEach(l => l.addEventListener('click', closeMenu));
        document.querySelector('.main-content').addEventListener('click', closeMenu);

        // [核心新增] 图片灯箱逻辑 - 自动替换高清图
        const imgModalElement = document.getElementById('imagePreviewModal');
        const imgModal = new bootstrap.Modal(imgModalElement);
        const previewImg = document.getElementById('previewImage');

        document.querySelectorAll('.zoom-trigger').forEach(trigger => {
            trigger.addEventListener('click', function(e) {
                e.preventDefault();
                const img = this.querySelector('img');
                if (img) {
                    // 将文件名中的 'thumbnail' 替换为 'large'，以加载高清图
                    let largeSrc = img.src.replace('thumbnail', 'large');
                    previewImg.src = largeSrc;
                    
                    // 容错：如果高清图不存在，回退到缩略图
                    previewImg.onerror = function() {
                        this.src = img.src;
                    };
                    
                    imgModal.show();
                }
            });
        });

        // 点击背景关闭
        imgModalElement.addEventListener('click', function() {
            imgModal.hide();
        });
    </script>
