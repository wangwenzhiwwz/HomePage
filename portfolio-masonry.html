<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - WWZ.iM</title>
    <meta name="description" content="A curated collection of creative works and projects by Wang Wenzhi.">
    <meta name="author" content="Wang Wenzhi">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wwz.im/portfolio-masonry.html">
    <meta property="og:title" content="Portfolio - WWZ.iM">
    <meta property="og:image" content="https://wangwenzhi.eu.org/images/favicon_io/android-chrome-512x512.png">

    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme');
            var systemIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = savedTheme ? savedTheme : (systemIsDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>html { background-color: #0a0a0a; }</style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="https://wangwenzhi.eu.org/images/favicon_io/favicon.ico">
    <meta name="theme-color" content="#0a0a0a">
    
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    
    <style>
        /* Portfolio specific styles */
        .filter-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 40px;
        }
        
        .filter-btn {
            padding: 10px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .filter-btn:hover,
        .filter-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
        }
        
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }
        
        .portfolio-item {
            opacity: 1;
            transform: scale(1);
            transition: all 0.4s ease;
        }
        
        .portfolio-item.hidden {
            opacity: 0;
            transform: scale(0.8);
            position: absolute;
            pointer-events: none;
        }
        
        .portfolio-card {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .portfolio-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }
        
        .portfolio-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .portfolio-card:hover .portfolio-img {
            transform: scale(1.05);
        }
        
        .portfolio-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }
        
        .portfolio-card:hover .portfolio-overlay {
            opacity: 1;
        }
        
        .portfolio-info h4 {
            color: white;
            margin: 0 0 5px;
            font-size: 1.1rem;
        }
        
        .portfolio-info span {
            color: rgba(255,255,255,0.7);
            font-size: 0.85rem;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--accent-color);
            transform: translateX(-5px);
        }
    </style>
</head>

<body>
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>
    
    <div id="loader">
        <div class="loader-spinner"></div>
    </div>

    <button id="theme-btn-desktop" class="d-none d-lg-flex" title="Toggle Theme" data-hover>
        <i class="fa-solid fa-moon"></i>
    </button>

    <aside class="sidebar glass-panel" id="sidebar"></aside>

    <main class="main-content">
        <a href="index.html" class="back-link" data-hover>
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
        
        <h1 class="section-title">Portfolio</h1>
        
        <div class="filter-menu">
            <button class="filter-btn active" data-filter="all" data-hover>All Works</button>
            <button class="filter-btn" data-filter="video" data-hover>Video</button>
            <button class="filter-btn" data-filter="photo" data-hover>Photography</button>
            <button class="filter-btn" data-filter="design" data-hover>Design</button>
            <button class="filter-btn" data-filter="web" data-hover>Web</button>
        </div>
        
        <div class="portfolio-grid" id="portfolioGrid">
            <!-- Items will be populated by JS -->
        </div>
        
        <footer>
            <p>&copy; <span id="copyright-year"></span> WWZ.iM. Crafted with passion.</p>
        </footer>
    </main>

    <!-- Image Preview Modal -->
    <div class="modal fade" id="imagePreviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-body">
                    <img id="previewImage" src="" alt="Full Preview">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script>
        // Portfolio data
        const portfolioItems = [
            { title: "Ulefone Commercial", category: "video", image: "images/video/maxresdefault.jpg" },
            { title: "Armor 27T Pro", category: "video", image: "images/video/Screenshot_2025-03-05_142413.png" },
            { title: "Armor 26 Ultra", category: "video", image: "images/video/Screenshot_2025-03-05_142626.png" },
            { title: "Nostalgia Portrait", category: "photo", image: "images/portfolio-thumbnail-1.jpg" },
            { title: "Workoholic City", category: "design", image: "images/portfolio-thumbnail-2.jpg" },
            { title: "Zoo Keeper", category: "design", image: "images/portfolio-thumbnail-3.jpg" },
            { title: "APP.WWZ.iM", category: "web", image: "images/portfolio-thumbnail-4.jpg" },
            { title: "SUB Converter", category: "web", image: "images/portfolio-thumbnail-5.jpg" },
            { title: "Product Showreel", category: "video", image: "images/video/Screenshot_2025-12-11_134113.png" },
        ];

        // Populate grid
        const grid = document.getElementById('portfolioGrid');
        portfolioItems.forEach(item => {
            const card = document.createElement('div');
            card.className = 'portfolio-item';
            card.dataset.category = item.category;
            card.innerHTML = `
                <div class="portfolio-card" data-hover>
                    <img src="${item.image}" alt="${item.title}" class="portfolio-img" 
                         onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'" loading="lazy">
                    <div class="portfolio-overlay">
                        <div class="portfolio-info">
                            <h4>${item.title}</h4>
                            <span>${item.category.charAt(0).toUpperCase() + item.category.slice(1)}</span>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        // Filter functionality
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const filter = btn.dataset.filter;
                document.querySelectorAll('.portfolio-item').forEach(item => {
                    if (filter === 'all' || item.dataset.category === filter) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            });
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('sidebar').innerHTML = WWZ.createSidebar('portfolio');
            WWZ.initCommon();
            
            // Re-bind hover events for dynamically added elements
            document.querySelectorAll('[data-hover]').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });
        });
    </script>
</body>
</html>
