  <style>
    .video-thumbnail {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      border-radius: 8px;
    }
    .video-thumbnail img {
      transition: transform 0.4s ease;
    }
    .video-thumbnail:hover img {
      transform: scale(1.08);
    }
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      background: rgba(0,0,0,0.6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .video-thumbnail:hover .play-icon {
      opacity: 1;
    }
    .play-icon::after {
      content: '';
      width: 0;
      height: 0;
      border-left: 20px solid white;
      border-top: 12px transparent solid;
      border-bottom: 12px transparent solid;
      margin-left: 5px;
    }

    /* 让视频弹窗更大 */
    @media (min-width: 1200px) {
      #videoModal .modal-dialog {
        max-width: 85vw;
        margin: 1.75rem auto;
      }
    }
    @media (min-width: 1400px) {
      #videoModal .modal-dialog {
        max-width: 90vw;
      }
    }
    @media (min-width: 1600px) {
      #videoModal .modal-dialog {
        max-width: 92vw;
      }
    }

    /* 可选：给 iframe 加圆角 */
    #videoIframe {
      border-radius: 12px;
    }
  </style>

  <script>
    // ==================== 所有视频数据集中管理 ====================
    const videos = [
      {
        title: "Project Title One",
        desc: "Motion Graphics • 2024",
        thumbnail: "images/video/maxresdefault.jpg",
        url: "https://www.youtube.com/embed/a7RQgUMkpwI",
        type: "youtube"
      },
      {
        title: "Brand Animation Reel",
        desc: "Commercial • 2024",
        thumbnail: "images/video-thumb2.jpg",
        url: "https://www.youtube.com/embed/VIDEO_ID_2",
        type: "youtube"
      },
      {
        title: "Short Film – Echoes",
        desc: "Narrative • 2023",
        thumbnail: "images/video-thumb3.jpg",
        url: "https://www.youtube.com/embed/VIDEO_ID_3",
        type: "youtube"
      },
      {
        title: "Product Promo",
        desc: "Advertising • 2023",
        thumbnail: "images/video-thumb4.jpg",
        url: "https://player.vimeo.com/video/VIDEO_ID_4",
        type: "vimeo"
      },
      {
        title: "Music Video",
        desc: "Direction • 2023",
        thumbnail: "images/video-thumb5.jpg",
        url: "https://www.youtube.com/embed/VIDEO_ID_5",
        type: "youtube"
      },
      {
        title: "Experimental Animation",
        desc: "Art • 2024",
        thumbnail: "images/video-thumb6.jpg",
        url: "https://www.youtube.com/embed/VIDEO_ID_6",
        type: "youtube"
      }
      // 添加更多视频只需在这里继续添加对象
    ];

    // ==================== 动态生成视频网格 ====================
    const videoGrid = document.getElementById('videoGrid');

    videos.forEach((video, index) => {
      const col = document.createElement('div');
      col.className = 'col-md-6 col-lg-4';
      col.setAttribute('data-aos', 'fade-up');
      col.setAttribute('data-aos-delay', (index % 3) * 100); // 错峰动画

      col.innerHTML = `
        <div class="video-thumbnail"
             data-bs-toggle="modal"
             data-bs-target="#videoModal"
             data-video-url="${video.url}"
             data-video-type="${video.type}">
          <img src="${video.thumbnail}" alt="${video.title}" class="img-fluid w-100">
          <div class="play-icon"></div>
        </div>
        <div class="mt-3">
          <h4>${video.title}</h4>
          <p class="text-muted">${video.desc}</p>
        </div>
      `;

      videoGrid.appendChild(col);
    });

    // ==================== Modal 动态加载视频 ====================
    const videoModal = document.getElementById('videoModal');

    videoModal.addEventListener('show.bs.modal', function (event) {
      const thumbnail = event.relatedTarget;
      const url = thumbnail.getAttribute('data-video-url');
      const type = thumbnail.getAttribute('data-video-type');

      const iframe = document.getElementById('videoIframe');
      iframe.src = url + (type === 'youtube' || type === 'vimeo' ? '?autoplay=1' : '');
    });

    // ==================== Modal 关闭时停止播放 ====================
    videoModal.addEventListener('hidden.bs.modal', function () {
      document.getElementById('videoIframe').src = '';
    });
  </script>
