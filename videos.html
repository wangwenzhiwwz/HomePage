  <style>
    /* ================= Global Layout ================= */
    body {
      padding-top: 80px; /* Prevent navbar overlap */
    }

    /* ================= Navbar & Logo Fixes ================= */
    .navbar {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      background-color: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--bs-border-color);
      transition: all 0.3s ease;
    }

    /* Logo Strict Sizing (Adaptive) */
    .navbar-brand {
      padding: 0;
      margin-right: 1rem;
      display: flex;
      align-items: center;
    }

    .navbar-brand img {
      height: 45px;       /* Fixed height for desktop */
      width: auto;        /* Maintain aspect ratio */
      object-fit: contain; 
      transition: height 0.3s ease;
    }

    /* Nav Links */
    .nav-link {
      font-weight: 500;
      color: var(--heading-color) !important;
      margin: 0 10px;
      position: relative;
    }
    
    .nav-link:hover, .nav-link.active {
      opacity: 0.7;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      display: block;
      margin-top: 5px;
      right: 0;
      background: var(--heading-color);
      transition: width 0.3s ease;
    }
    
    .nav-link:hover::after, .nav-link.active::after {
      width: 100%;
      left: 0;
    }

    /* ================= Video Grid Styles ================= */
    .video-thumbnail {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      background-color: var(--bs-gray-200);
    }
    
    .video-thumbnail img {
      transition: transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
      width: 100%;
      height: auto;
      object-fit: cover;
      aspect-ratio: 16/9;
      display: block;
    }
    
    .video-thumbnail:hover img {
      transform: scale(1.05);
    }

    /* Play Icon */
    .play-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 2;
    }
    
    .video-thumbnail:hover .play-icon {
      opacity: 1;
    }

    .play-icon svg {
        width: 24px;
        height: 24px;
        fill: #000 !important; /* Force black icon */
        stroke: none !important;
        margin-left: 4px;
    }

    h4 {
        font-weight: 700;
        margin-top: 0.8rem;
        margin-bottom: 0.2rem;
        font-size: 1.1rem;
        color: var(--heading-color);
    }

    /* ================= Modal ================= */
    #videoModal .modal-dialog {
      max-width: 90vw;
      width: 90vw;
      margin: 2rem auto;
    }
    @media (min-width: 992px) {
      #videoModal .modal-dialog { max-width: 85vw; width: 85vw; }
    }
    @media (min-width: 1400px) {
      #videoModal .modal-dialog { max-width: 1200px; width: 80vw; }
    }
    
    #videoIframe { 
      border-radius: 12px; 
      background: #000;
    }
    #videoModal .modal-content { background: transparent; border: none; }

    /* ================= Mobile & Dark Mode ================= */
    
    /* Mobile Optimization */
    @media (max-width: 991px) {
        .navbar-brand img {
            height: 35px; /* Smaller logo on mobile */
        }
        body {
            padding-top: 70px;
        }
    }

    /* Dark Mode Overrides */
    @media (prefers-color-scheme: dark) {
      .navbar {
        background-color: rgba(15, 15, 15, 0.85);
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .navbar-toggler-icon {
        filter: invert(1);
      }
      .video-thumbnail {
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      }
    }
