<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team - WWZ.iM</title>
    <meta name="description" content="Meet the creative minds behind WWZ.iM projects.">
    <meta name="author" content="Wang Wenzhi">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wwz.im/team.html">
    <meta property="og:title" content="Team - WWZ.iM">
    <meta property="og:image" content="https://wangwenzhi.eu.org/images/favicon_io/android-chrome-512x512.png">

    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme');
            var systemIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = savedTheme ? savedTheme : (systemIsDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme); document.documentElement.style.backgroundColor = theme === 'dark' ? '#0a0a0a' : '#f5f5f7';
        })();
    </script>
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="https://wangwenzhi.eu.org/images/favicon_io/favicon.ico">
    <meta name="theme-color" content="#0a0a0a">
    
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    
    <style>
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
        }
        
        .team-card {
            text-align: center;
            padding: 40px 30px;
        }
        
        .team-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--glass-border);
            margin-bottom: 20px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
        .team-card:hover .team-avatar {
            transform: scale(1.1) rotate(5deg);
            border-color: var(--accent-color);
            box-shadow: 0 0 30px var(--accent-glow);
        }
        
        .team-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .team-role {
            color: var(--accent-color);
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .team-bio {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .team-social {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        
        .team-social a {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--pill-bg);
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }
        
        .team-social a:hover {
            background: var(--accent-color);
            color: white;
            transform: translateY(-3px);
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--accent-color);
            transform: translateX(-5px);
        }
        
        .team-intro {
            max-width: 600px;
            margin-bottom: 50px;
        }
        
        .team-intro p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.8;
        }
    </style>
    <link rel="stylesheet" href="css/site-system.css">
</head>

<body>
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>
    
    <div id="loader">
        <div class="loader-spinner"></div>
    </div>

    <button id="theme-btn-desktop" class="d-none d-lg-flex" title="Toggle Theme" data-hover>
        <i class="fa-solid fa-moon"></i>
    </button>

    <aside class="sidebar glass-panel" id="sidebar"></aside>

    <main class="main-content">
        <a href="index.html" class="back-link" data-hover>
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
        
        <h1 class="section-title">Meet The Team</h1>
        
        <div class="team-intro">
            <p>We're a small but mighty team of creatives and technologists. Together, we craft visual stories and build robust digital solutions.</p>
        </div>
        
        <div class="team-grid" id="teamGrid">
            <!-- Items populated by JS -->
        </div>
        
        <footer>
            <p>&copy; <span id="copyright-year"></span> WWZ.iM. Crafted with passion.</p>
        </footer>
    </main>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
    <script src="js/shared.js"></script>
    <script>
        const teamMembers = [
            {
                name: "Wang Wenzhi",
                role: "Founder & Director",
                avatar: "https://wangwenzhi.eu.org/images/favicon_io/android-chrome-512x512.png",
                bio: "Commercial Director with a passion for visual storytelling and network infrastructure.",
                social: {
                    twitter: "https://x.com/wwz_im",
                    github: "https://github.com/wangwenzhiwwz",
                    email: "mailto:wwz.im@outlook.com"
                }
            },
            {
                name: "Creative Team",
                role: "Visual Production",
                avatar: "https://via.placeholder.com/200?text=Team",
                bio: "Our talented team of cinematographers, editors, and designers bringing ideas to life.",
                social: {}
            },
            {
                name: "Tech Partners",
                role: "Development & Infrastructure",
                avatar: "https://via.placeholder.com/200?text=Tech",
                bio: "Expert developers and network engineers building the digital backbone of our projects.",
                social: {}
            }
        ];

        const grid = document.getElementById('teamGrid');
        teamMembers.forEach(member => {
            const socialLinks = Object.entries(member.social).map(([platform, url]) => {
                const icons = {
                    twitter: 'fa-brands fa-x-twitter',
                    github: 'fa-brands fa-github',
                    linkedin: 'fa-brands fa-linkedin-in',
                    email: 'fa-solid fa-envelope'
                };
                return `<a href="${url}" target="_blank" data-hover><i class="${icons[platform] || 'fa-solid fa-link'}"></i></a>`;
            }).join('');

            const card = document.createElement('div');
            card.className = 'glass-card team-card';
            card.setAttribute('data-hover', '');
            card.innerHTML = `
                <img src="${member.avatar}" alt="${member.name}" class="team-avatar" 
                     onerror="this.src='https://via.placeholder.com/200?text=Avatar'">
                <h3 class="team-name">${member.name}</h3>
                <div class="team-role">${member.role}</div>
                <p class="team-bio">${member.bio}</p>
                ${socialLinks ? `<div class="team-social">${socialLinks}</div>` : ''}
            `;
            grid.appendChild(card);
        });

        document.addEventListener('DOMContentLoaded', () => {
            WWZ.initCommon();
            
            document.querySelectorAll('[data-hover]').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });
        });
    </script>
    <script src="js/site-shell.js"></script>
</body>
</html>
