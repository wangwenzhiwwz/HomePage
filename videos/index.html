    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme');
            var systemIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = savedTheme ? savedTheme : (systemIsDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.backgroundColor = theme === 'dark' ? '#050505' : '#ffffff';
        })();
    </script>

    <style>
        /* --- 核心设计系统 --- */
        :root { --transition-speed: 0.4s; --font-main: 'SF Pro Display', sans-serif; --font-mono: 'JetBrains Mono', monospace; }
        
        /* [暗黑模式] */
        :root[data-theme="dark"] {
            --bg-body: #050505; 
            --bg-gradient: linear-gradient(180deg, #050505 0%, #000000 100%);
            --text-primary: #ffffff; 
            --text-secondary: #888888;
            --glass-bg: rgba(20, 20, 20, 0.95); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --accent-color: #ffffff; 
            --pill-bg: rgba(255, 255, 255, 0.1); 
            --active-bg: rgba(255, 255, 255, 0.2);
            --card-hover-bg: rgba(255, 255, 255, 0.05);
            --menu-bg-mobile: #0a0a0a; /* 移动端菜单背景 */
        }

        /* [亮色模式] */
        :root[data-theme="light"] {
            --bg-body: #ffffff; 
            --bg-gradient: linear-gradient(180deg, #ffffff 0%, #fafafa 100%);
            --text-primary: #000000; 
            --text-secondary: #555555;
            --glass-bg: rgba(255, 255, 255, 0.95); 
            --glass-border: rgba(0, 0, 0, 0.1);
            --accent-color: #000000; 
            --pill-bg: rgba(0, 0, 0, 0.05); 
            --active-bg: rgba(0, 0, 0, 0.1);
            --card-hover-bg: rgba(0, 0, 0, 0.02);
            --menu-bg-mobile: #ffffff; /* 移动端菜单背景 */
        }

        /* 全局重置 */
        ::-webkit-scrollbar { display: none; width: 0; height: 0; }
        html, body { scrollbar-width: none; -ms-overflow-style: none; }
        * { -webkit-tap-highlight-color: transparent; }
        
        html { scroll-behavior: smooth; }
        body { 
            font-family: var(--font-main); 
            background: var(--bg-body); 
            background-image: var(--bg-gradient); 
            background-attachment: fixed; 
            color: var(--text-primary); 
            transition: background 0.5s ease, color 0.5s ease; 
            cursor: default;
        }
        
        a { text-decoration: none; color: inherit; transition: 0.3s; cursor: pointer; }
        button, .btn { cursor: pointer; }

        /* --- 布局框架 --- */
        .glass-panel { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 24px; }
        
        /* PC 端侧边栏 (默认样式) */
        .sidebar { 
            position: fixed; top: 30px; bottom: 30px; left: 30px; width: 260px; z-index: 100; 
            padding: 40px 24px; display: flex; flex-direction: column; overflow-y: auto; 
        }
        
        .main-content { margin-left: 310px; padding: 40px 40px 80px 0; min-height: 100vh; }
        
        @media (min-width: 1200px) {
            .main-content .container-fluid { max-width: 1140px; margin: 0 auto; }
        }

        /* --- 侧边栏组件 --- */
        .sidebar-header { text-align: center; margin-bottom: 20px; width: 100%; }
        .profile-img { 
            width: 100px; height: 100px; border-radius: 50%; object-fit: cover; 
            border: 3px solid var(--glass-border); margin-bottom: 15px; 
        }
        .profile-name { font-weight: 800; font-size: 1.5rem; margin-bottom: 5px; color: var(--text-primary); letter-spacing: -0.5px; }
        .handle-pill { display: inline-block; font-family: var(--font-mono); font-size: 0.8rem; background: var(--pill-bg); padding: 4px 14px; border-radius: 50px; opacity: 0.8; }

        .nav-section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; margin: 25px 0 10px 10px; opacity: 0.5; font-weight: 700; }
        .nav-menu { list-style: none; padding: 0; margin: 0; }
        .nav-link { 
            color: var(--text-secondary); font-weight: 600; padding: 10px 14px; 
            border-radius: 12px; display: flex; align-items: center; gap: 12px; 
            transition: 0.3s; margin-bottom: 5px; font-size: 0.9rem; 
        }
        .nav-link:hover { color: var(--text-primary); background: var(--pill-bg); transform: translateX(4px); }
        .nav-link.active { color: var(--text-primary); background: var(--active-bg); }
        .badge-pro { font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; background: var(--text-primary); color: var(--bg-body); font-weight: 700; margin-left: auto; }

        .social-dock { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: auto; padding-top: 30px; border-top: 1px solid var(--glass-border); }
        .social-icon { 
            width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            border: 1px solid var(--glass-border); color: var(--text-secondary); transition: 0.3s; 
        }
        .social-icon:hover { background: var(--text-primary); color: var(--bg-body); transform: translateY(-3px); }

        /* --- 视频页面特定样式 --- */
        .back-link { display: inline-flex; align-items: center; gap: 10px; color: var(--text-secondary); font-weight: 600; margin-bottom: 30px; }
        .back-link:hover { color: var(--text-primary); transform: translateX(-5px); }

        .page-intro { max-width: 700px; margin-bottom: 50px; }
        .page-intro p { font-size: 1.1rem; line-height: 1.6; color: var(--text-secondary); }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        
        .video-card {
            border-radius: 16px; overflow: hidden; background: transparent;
            border: 1px solid var(--glass-border); transition: 0.3s; cursor: pointer;
            position: relative;
        }
        .video-card:hover { transform: translateY(-5px); border-color: var(--text-primary); background: var(--card-hover-bg); }
        
        .video-thumbnail { position: relative; aspect-ratio: 16/9; overflow: hidden; border-radius: 12px; margin: 12px 12px 0 12px; }
        .video-thumbnail img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .video-card:hover .video-thumbnail img { transform: scale(1.05); }
        
        .play-btn-overlay { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 50px; height: 50px; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 18px; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s;
        }
        .video-card:hover .play-btn-overlay { transform: translate(-50%, -50%) scale(1.1); background: rgba(0,0,0,0.6); }

        .video-info { padding: 20px; }
        .video-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 6px; color: var(--text-primary); }
        .video-desc { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .video-meta { display: flex; gap: 15px; font-size: 0.8rem; color: var(--text-secondary); opacity: 0.7; }
        .video-meta span { display: flex; align-items: center; gap: 5px; }

        .external-links { display: flex; flex-wrap: wrap; gap: 15px; margin-top: 60px; }
        .external-link { 
            display: flex; align-items: center; gap: 10px; padding: 12px 24px; 
            border: 1px solid var(--glass-border); border-radius: 50px; 
            font-weight: 600; color: var(--text-secondary); transition: 0.3s; 
        }
        .external-link:hover { border-color: var(--text-primary); color: var(--text-primary); background: var(--card-hover-bg); }

        /* Controls */
        #theme-btn-desktop { 
            position: fixed; top: 30px; right: 40px; z-index: 10000; width: 44px; height: 44px; border-radius: 50%; 
            background: var(--glass-bg); backdrop-filter: blur(10px); border: 1px solid var(--glass-border); color: var(--text-primary); 
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        #theme-btn-desktop:hover { transform: scale(1.1); background: var(--text-primary); color: var(--bg-body); }

        .mobile-btn { 
            width: 36px; height: 36px; border-radius: 10px; background: rgba(125, 125, 125, 0.1); 
            border: 1px solid var(--glass-border); color: var(--text-primary); 
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .mobile-btn:hover { background: var(--text-primary); color: var(--bg-body); }

        /* Back to Top */
        #back-to-top {
            position: fixed; bottom: 30px; right: 30px;
            width: 48px; height: 48px; border-radius: 50%;
            background: var(--text-primary); color: var(--bg-body);
            border: none; display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: translateY(20px);
        }
        #back-to-top.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }

        footer { margin-top: 80px; padding-top: 40px; border-top: 1px solid var(--glass-border); color: var(--text-secondary); font-size: 0.9rem; text-align: center; }

        /* --- [关键修复] 移动端深度适配 (修复遮挡、全屏、背景透明问题) --- */
        @media (max-width: 991px) {
            /* 1. 解决遮挡问题：加大顶部内边距 */
            .main-content { 
                margin-left: 0 !important; 
                padding: 100px 20px 40px 20px !important; /* Header Height (approx 60px) + 40px gap */
            }
            
            /* 2. 顶部导航栏：强制高度自适应，防止铺满全屏 */
            .sidebar {
                position: fixed !important; 
                top: 0 !important; 
                left: 0 !important; 
                right: 0 !important; 
                bottom: auto !important; /* [重点] 取消PC端的 bottom: 30px */
                
                width: 100% !important; 
                height: auto !important; /* [重点] 高度由内容撑开 */
                min-height: 60px;
                
                background: var(--bg-body) !important; /* 纯色背景，防止透明 */
                border-bottom: 1px solid var(--glass-border);
                border-radius: 0 !important;
                
                z-index: 100000; /* 最高层级 */
                margin: 0 !important; 
                padding: 10px 20px !important;
                
                display: flex; 
                flex-direction: column; 
                
                /* 允许下拉菜单溢出容器显示 */
                overflow: visible !important; 
            }

            .sidebar-header { 
                display: flex; align-items: center; justify-content: space-between; 
                text-align: left; margin-bottom: 0 !important; width: 100%;
            }

            .profile-img { width: 36px !important; height: 36px !important; margin: 0 12px 0 0 !important; border-width: 1px; }
            .profile-name { font-size: 1.1rem; margin: 0; font-weight: 700; }
            .handle-pill { display: none; }
            .sidebar-controls { margin-left: auto; display: flex; gap: 10px; }

            /* 3. 下拉菜单：纯色背景 + 阴影 + 独立滚动 */
            .sidebar-content {
                position: absolute; 
                top: 100%; left: 0; width: 100%;
                
                background: var(--menu-bg-mobile); /* 纯色背景 */
                border-bottom: 1px solid var(--glass-border);
                box-shadow: 0 20px 50px rgba(0,0,0,0.3);
                
                display: flex !important; flex-direction: column;
                margin-top: 0; padding: 0;
                
                opacity: 0; visibility: hidden;
                transform: translateY(-10px);
                transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
                
                max-height: 75vh; 
                overflow-y: auto; /* 防止菜单过长无法点击底部 */
                pointer-events: none;
            }

            /* 激活状态 */
            .sidebar-content.show { 
                opacity: 1; visibility: visible; 
                transform: translateY(0); 
                pointer-events: auto;
            }

            /* 4. 菜单项样式 - 紧凑版 */
            .nav-section-title { display: none; } /* 隐藏分类标题 */
            .nav-menu { padding: 0; margin: 0; }
            .nav-link {
                padding: 14px 24px; 
                border-radius: 0;
                border-bottom: 1px solid var(--glass-border);
                font-size: 1rem;
            }
            .nav-link:last-child { border-bottom: none; }
            
            /* 分割线逻辑 */
            .nav-menu + .nav-menu { border-top: 4px solid var(--glass-border); }

            .social-dock { 
                padding: 15px 20px; 
                background: var(--card-hover-bg); 
                margin-top: 0;
                border-top: 1px solid var(--glass-border);
                gap: 20px;
            }

            .video-grid { grid-template-columns: 1fr; }
        }

        #loader { position: fixed; inset: 0; background: var(--bg-body); z-index: 1000000; display: flex; justify-content: center; align-items: center; transition: 0.5s; }
    </style>
</head>

        document.addEventListener('DOMContentLoaded', () => {
            // 1. Render Sidebar
            document.getElementById('sidebar').innerHTML = createSidebar('videos');
            document.getElementById('loader').style.display = 'none';
            document.getElementById('copyright-year').textContent = new Date().getFullYear();

            // 2. Render Video Grid
            const grid = document.getElementById('videoGrid');
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.setAttribute('data-bs-toggle', 'modal');
                card.setAttribute('data-bs-target', '#videoModal');
                card.setAttribute('data-video-url', video.url);
                card.innerHTML = `
                    <div class="video-thumbnail">
                        <img src="${video.thumbnail}" alt="${video.title}" 
                             onerror="this.src='https://placehold.co/640x360?text=No+Image'" loading="lazy">
                        <div class="play-btn-overlay"><i class="fa-solid fa-play"></i></div>
                    </div>
                    <div class="video-info">
                        <h3 class="video-title">${video.title}</h3>
                        <p class="video-desc">${video.desc}</p>
                        <div class="video-meta">
                            <span><i class="fa-solid fa-calendar"></i> ${video.year}</span>
                            <span><i class="fa-solid fa-film"></i> Commercial</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });

            // 3. Setup Theme Logic
            const desktopBtn = document.getElementById('theme-btn-desktop');
            const mobileBtn = document.getElementById('theme-btn-mobile');
            let isDark = document.documentElement.getAttribute('data-theme') === 'dark';

            const updateIcons = () => {
                const iconHtml = isDark ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
                if(desktopBtn) desktopBtn.innerHTML = iconHtml;
                if(mobileBtn) mobileBtn.innerHTML = iconHtml;
            };
            updateIcons();

            const toggleTheme = () => {
                isDark = !isDark;
                const newTheme = isDark ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                document.documentElement.style.backgroundColor = isDark ? '#050505' : '#ffffff';
                localStorage.setItem('theme', newTheme);
                updateIcons();
            };

            if(desktopBtn) desktopBtn.addEventListener('click', toggleTheme);
            if(mobileBtn) mobileBtn.addEventListener('click', toggleTheme);

            // 4. Setup Mobile Menu (Fixed)
            const mobileToggle = document.getElementById('mobile-toggle');
            const sidebarContent = document.getElementById('sidebar-content');
            if (mobileToggle && sidebarContent) {
                mobileToggle.addEventListener('click', () => {
                    sidebarContent.classList.toggle('show');
                    const icon = mobileToggle.querySelector('i');
                    if (sidebarContent.classList.contains('show')) {
                        icon.classList.remove('fa-bars');
                        icon.classList.add('fa-xmark');
                    } else {
                        icon.classList.remove('fa-xmark');
                        icon.classList.add('fa-bars');
                    }
                });
            }

            const closeMenu = () => {
                if(window.innerWidth < 992 && sidebarContent && sidebarContent.classList.contains('show')) {
                    mobileToggle.click();
                }
            };
            document.querySelectorAll('.nav-link').forEach(l => l.addEventListener('click', closeMenu));
            document.querySelector('.main-content').addEventListener('click', closeMenu);

            // 5. Video Modal Logic
            const vModal = document.getElementById('videoModal');
            const vFrame = document.getElementById('videoIframe');
            vModal.addEventListener('show.bs.modal', e => {
                const btn = e.relatedTarget;
                let url = btn.getAttribute('data-video-url');
                if (url.includes('youtube.com') || url.includes('youtu.be')) {
                    url += (url.includes('?') ? '&' : '?') + 'autoplay=1&rel=0';
                } else if (url.includes('vimeo.com')) {
                    url += (url.includes('?') ? '&' : '?') + 'autoplay=1';
                }
                vFrame.src = url;
            });
            vModal.addEventListener('hidden.bs.modal', () => { vFrame.src = ''; });

            // 6. Back to Top
            const fab = document.getElementById('back-to-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) fab.classList.add('visible');
                else fab.classList.remove('visible');
            });
            fab.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        });
    </script>
</body>
</html>
