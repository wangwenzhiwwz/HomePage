<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos - WWZ.iM</title>
    <meta name="description" content="Video works and motion projects by Wang Wenzhi.">
    <meta name="author" content="Wang Wenzhi">
    
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wwz.im/videos/">
    <meta property="og:title" content="Videos - WWZ.iM">
    <meta property="og:image" content="https://wangwenzhi.eu.org/images/favicon_io/android-chrome-512x512.png">

    <script>
        (function() {
            var savedTheme = localStorage.getItem('theme');
            var systemIsDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            var theme = savedTheme ? savedTheme : (systemIsDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>html { background-color: #0a0a0a; }</style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="https://wangwenzhi.eu.org/images/favicon_io/favicon.ico">
    <meta name="theme-color" content="#0a0a0a">
    
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }
        
        .video-card {
            border-radius: 16px;
            overflow: hidden;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
        }
        
        .video-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }
        
        .video-thumbnail {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
        }
        
        .video-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .video-card:hover .video-thumbnail img {
            transform: scale(1.05);
        }
        
        .video-info {
            padding: 20px;
        }
        
        .video-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        
        .video-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        
        .video-meta {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        
        .video-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--accent-color);
            transform: translateX(-5px);
        }
        
        .page-intro {
            max-width: 600px;
            margin-bottom: 50px;
        }
        
        .page-intro p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.8;
        }
        
        .external-links {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 50px;
        }
        
        .external-link {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px 25px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .external-link:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: white;
            transform: translateY(-3px);
        }
        
        .external-link i {
            font-size: 1.2rem;
        }
    </style>
</head>

<body>
    <div class="cursor-dot"></div>
    <div class="cursor-circle"></div>
    
    <div id="loader">
        <div class="loader-spinner"></div>
    </div>

    <button id="theme-btn-desktop" class="d-none d-lg-flex" title="Toggle Theme" data-hover>
        <i class="fa-solid fa-moon"></i>
    </button>

    <aside class="sidebar glass-panel" id="sidebar"></aside>

    <main class="main-content">
        <a href="../index.html" class="back-link" data-hover>
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>
        
        <h1 class="section-title">Video Works</h1>
        
        <div class="page-intro">
            <p>A collection of commercial videos, product showcases, and creative motion projects directed and produced for global brands.</p>
        </div>
        
        <div class="video-grid" id="videoGrid">
            <!-- Items populated by JS -->
        </div>
        
        <div class="external-links">
            <a href="https://www.youtube.com/@wangwenzhi" target="_blank" class="external-link" data-hover>
                <i class="fa-brands fa-youtube"></i>
                YouTube Channel
            </a>
            <a href="https://vimeo.com/wangwenzhi" target="_blank" class="external-link" data-hover>
                <i class="fa-brands fa-vimeo-v"></i>
                Vimeo Portfolio
            </a>
        </div>
        
        <footer>
            <p>&copy; <span id="copyright-year"></span> WWZ.iM. Crafted with passion.</p>
        </footer>
    </main>

    <!-- Video Modal -->
    <div class="modal fade" id="videoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered">
            <div class="modal-content bg-transparent border-0">
                <div class="position-relative">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3 z-3" data-bs-dismiss="modal"></button>
                    <div class="ratio ratio-16x9 rounded-4 overflow-hidden shadow-lg">
                        <iframe id="videoIframe" src="" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
    <script src="../js/shared.js"></script>
    <script>
        const videos = [
            { title: "Ulefone Armor 34 Pro", desc: "Autofocus Projector Commercial", year: "2025", thumbnail: "../images/video/maxresdefault.jpg", url: "https://www.youtube.com/embed/a7RQgUMkpwI" },
            { title: "Product Showreel 2024", desc: "Annual compilation of commercial works", year: "2024", thumbnail: "../images/video/Screenshot_2025-12-11_134113.png", url: "https://player.vimeo.com/video/1149403074" },
            { title: "Armor Mini 20T Pro", desc: "Thermal Mini Product Launch", year: "2024", thumbnail: "../images/video/Screenshot_2025-12-11_140000.png", url: "https://www.youtube.com/embed/diWNAaazdoM" },
            { title: "Ulefone Armor 27T Pro", desc: "FLIR Thermal Pro Campaign", year: "2024", thumbnail: "../images/video/Screenshot_2025-03-05_142413.png", url: "https://www.youtube.com/embed/aW8FSVuJY7U" },
            { title: "Ulefone Armor 26 Ultra", desc: "Mega Performance 5G Launch", year: "2024", thumbnail: "../images/video/Screenshot_2025-03-05_142626.png", url: "https://www.youtube.com/embed/Y2yPBSYQkfw" },
            { title: "Ulefone Armor 23 Ultra", desc: "Satellite Communication Feature", year: "2024", thumbnail: "../images/video/Screenshot_2025-12-11_135753.png", url: "https://www.youtube.com/embed/ynM2jFYncnE" },
            { title: "Ulefone Armor 22", desc: "NightElf Ultra 2.0 Night Vision", year: "2023", thumbnail: "../images/video/Screenshot_2025-03-05_142821.png", url: "https://www.youtube.com/embed/GVeko9aDHzw" },
        ];

        const grid = document.getElementById('videoGrid');
        videos.forEach(video => {
            const card = document.createElement('div');
            card.className = 'video-card';
            card.setAttribute('data-hover', '');
            card.setAttribute('data-bs-toggle', 'modal');
            card.setAttribute('data-bs-target', '#videoModal');
            card.setAttribute('data-video-url', video.url);
            card.innerHTML = `
                <div class="video-thumbnail">
                    <img src="${video.thumbnail}" alt="${video.title}" 
                         onerror="this.src='https://via.placeholder.com/640x360?text=No+Image'" loading="lazy">
                    <div class="play-btn-overlay"><i class="fa-solid fa-play"></i></div>
                </div>
                <div class="video-info">
                    <h3 class="video-title">${video.title}</h3>
                    <p class="video-desc">${video.desc}</p>
                    <div class="video-meta">
                        <span><i class="fa-solid fa-calendar"></i> ${video.year}</span>
                        <span><i class="fa-solid fa-film"></i> Commercial</span>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        // Video modal logic
        const vModal = document.getElementById('videoModal');
        const vFrame = document.getElementById('videoIframe');
        
        vModal.addEventListener('show.bs.modal', e => {
            const btn = e.relatedTarget;
            const url = btn.getAttribute('data-video-url');
            const isYouTube = url.includes('youtube');
            vFrame.src = url + (isYouTube ? '?autoplay=1&rel=0' : '?autoplay=1');
        });
        
        vModal.addEventListener('hidden.bs.modal', () => {
            vFrame.src = '';
        });

        // Fix paths for subdirectory
        WWZ.createSidebar = function(activePage) {
            const pages = {
                home: { href: '../index.html', icon: 'fa-house', label: 'Home' },
                videos: { href: '../videos/', icon: 'fa-film', label: 'Videos' },
                portfolio: { href: '../portfolio-masonry.html', icon: 'fa-layer-group', label: 'Works' },
                team: { href: '../team.html', icon: 'fa-users', label: 'Team' },
                styles: { href: '../styles.html', icon: 'fa-palette', label: 'Styles', badge: 'PRO' },
                blog: { href: 'https://blog.wwz.im/', icon: 'fa-blogger fab', label: 'Blog', external: true, badge: 'PRO' },
                apps: { href: 'https://app.wwz.im/', icon: 'fa-compass', label: 'App Nav', external: true, badge: 'PRO' }
            };

            const menuItems = ['home', 'videos', 'portfolio', 'team'];
            const resourceItems = ['styles', 'blog', 'apps'];

            const createNavItem = (key) => {
                const page = pages[key];
                const isActive = key === activePage ? 'active' : '';
                const target = page.external ? 'target="_blank"' : '';
                const iconClass = page.icon.includes('fab') ? page.icon : `fa-solid ${page.icon}`;
                const badge = page.badge ? `<span class="badge-pro">${page.badge}</span>` : '';
                
                return `<li class="nav-item">
                    <a href="${page.href}" class="nav-link ${isActive}" ${target} data-hover>
                        <i class="${iconClass}"></i> ${page.label} ${badge}
                    </a>
                </li>`;
            };

            return `
            <div class="sidebar-header">
                <div class="d-flex align-items-center justify-content-between w-100 d-lg-block">
                    <a href="../index.html" class="d-flex align-items-center d-lg-block text-lg-center text-reset">
                        <img src="https://wangwenzhi.eu.org/images/favicon_io/android-chrome-512x512.png" 
                             alt="Wang Wenzhi" 
                             class="profile-img d-block mx-lg-auto">
                        <div class="profile-info text-start text-lg-center">
                            <h1 class="profile-name">Wang Wenzhi</h1>
                            <div class="handle-pill d-none d-lg-inline-block">@WWZ.iM</div>
                        </div>
                    </a>
                    
                    <div class="sidebar-controls d-lg-none">
                        <button class="mobile-btn me-2" id="theme-btn-mobile" data-hover>
                            <i class="fa-solid fa-moon"></i>
                        </button>
                        <button class="mobile-btn" id="mobile-toggle" data-hover>
                            <i class="fa-solid fa-bars"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="sidebar-content d-flex flex-column flex-grow-1" id="sidebar-content">
                <span class="nav-section-title">Menu</span>
                <ul class="nav-menu">
                    ${menuItems.map(createNavItem).join('')}
                </ul>

                <span class="nav-section-title">Resources</span>
                <ul class="nav-menu">
                    ${resourceItems.map(createNavItem).join('')}
                </ul>

                <div class="social-dock">
                    <a href="https://x.com/wwz_im" target="_blank" class="social-icon" title="Twitter/X" data-hover><i class="fa-brands fa-x-twitter"></i></a>
                    <a href="https://github.com/wangwenzhiwwz" target="_blank" class="social-icon" title="GitHub" data-hover><i class="fa-brands fa-github"></i></a>
                    <a href="https://www.youtube.com/@wangwenzhi" target="_blank" class="social-icon" title="YouTube" data-hover><i class="fa-brands fa-youtube"></i></a>
                    <a href="https://www.facebook.com/wangwenzhiwwz" target="_blank" class="social-icon" title="Facebook" data-hover><i class="fa-brands fa-facebook"></i></a>
                    <a href="https://www.instagram.com/wangwenzhiwwz/" target="_blank" class="social-icon" title="Instagram" data-hover><i class="fa-brands fa-instagram"></i></a>
                    <a href="mailto:wwz.im@outlook.com" class="social-icon" title="Email" data-hover><i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>`;
        };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('sidebar').innerHTML = WWZ.createSidebar('videos');
            WWZ.initCommon();
            
            document.querySelectorAll('[data-hover]').forEach(el => {
                el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });
        });
    </script>
</body>
</html>
