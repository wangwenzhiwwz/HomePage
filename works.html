<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f5">
  <script data-theme-bootstrap>
    // Inline intentionally: the initial canvas must not wait for a network request.
    (() => {
      const root = document.documentElement;
      let mode = 'system';
      try { mode = localStorage.getItem('wwz-theme-mode') || 'system'; } catch (_) {}
      if (!['light', 'dark'].includes(mode)) mode = 'system';
      const theme = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
      const background = theme === 'dark' ? '#0b0b0a' : '#f7f7f5';
      root.dataset.theme = theme;
      root.dataset.themeMode = mode;
      root.style.colorScheme = theme;
      root.style.backgroundColor = background;
      root.style.setProperty('--wwz-initial-bg', background);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', background);
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', theme);
    })();
  </script>
  <style data-theme-startup>
    html { --wwz-initial-bg:#f7f7f5; background:var(--wwz-initial-bg); color-scheme:light; }
    @media (prefers-color-scheme:dark) { html { --wwz-initial-bg:#0b0b0a; color-scheme:dark; } }
    html:not([data-theme-ready]), html:not([data-theme-ready]) body { background:var(--wwz-initial-bg) !important; background-image:none !important; }
    html:not([data-theme-ready]), html:not([data-theme-ready]) * { transition:none !important; }
  </style>
  <script src="js/site-theme.js?v=20260920-inline-theme"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works — WANGWENZHI | WWZ.iM</title>
    <meta name="description" content="A curated collection of creative works and projects by Wang Wenzhi.">
    <meta name="author" content="Wang Wenzhi">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://wwz.im/works.html">
    <meta property="og:title" content="Portfolio - WWZ.iM">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.1/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/legacy-pages.css">

</head>

<body class="works-page">
    <aside class="sidebar glass-panel" id="sidebar"></aside>

    <main class="main-content">
        <header class="works-intro">
            <h1>Selected Works</h1>
            <p>Selected photography, 3D works and visual experiments from ZCOOL.</p>
        </header>
        <section class="works-controls" aria-label="作品筛选">
            <div class="filter-menu" role="group" aria-label="作品分类">
                <button class="filter-btn" type="button" data-filter="all" aria-pressed="true">全部作品</button>
                <button class="filter-btn" type="button" data-filter="摄影" aria-pressed="false">摄影</button>
                <button class="filter-btn" type="button" data-filter="三维" aria-pressed="false">三维</button>
                <button class="filter-btn" type="button" data-filter="插画" aria-pressed="false">插画</button>
            </div>
            <div class="works-tools">
                <label class="works-search"><i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i><input id="worksSearch" type="search" placeholder="搜索作品、分类或标签" autocomplete="off" aria-label="搜索作品"></label>
                <label class="works-sort"><span>排序</span><select id="worksSort" aria-label="作品排序"><option value="newest">最新发布</option><option value="oldest">最早发布</option></select></label>
            </div>
        </section>
        <p class="works-count" id="worksCount" role="status" aria-live="polite">正在载入作品…</p>
        <div class="portfolio-grid" id="portfolioGrid">
            <!-- Items will be populated by JS -->
        </div>

        <footer>
            <p>&copy; <span data-copyright-year>2026</span> WWZ.iM. Crafted with passion.</p>
        </footer>
    </main>

    <dialog class="image-viewer" id="imageViewer" aria-labelledby="viewerTitle">
        <div class="viewer-toolbar">
            <div><h2 id="viewerTitle"></h2><p id="viewerPosition" role="status"></p><p id="viewerDate"></p></div>
            <div class="viewer-tools">
                <a id="viewerSource" class="viewer-source" href="#" target="_blank" rel="noopener noreferrer">站酷原作 ↗</a>
                <button type="button" id="viewerZoom" aria-label="Zoom image" aria-pressed="false">Zoom +</button>
                <button type="button" id="viewerClose" aria-label="Close image preview" autofocus>Close ×</button>
            </div>
        </div>
        <div class="viewer-stage" id="viewerStage" aria-busy="false">
            <img id="viewerImage" alt="" draggable="false" referrerpolicy="no-referrer">
            <p id="viewerStatus" role="status"></p>
        </div>
        <div class="viewer-bottom">
            <button type="button" id="viewerPrevious" aria-label="Previous image">← Previous</button>
            <span>Swipe or use arrow keys</span>
            <button type="button" id="viewerNext" aria-label="Next image">Next →</button>
        </div>
    </dialog>
    <script src="data/works.js?v=20261030-zcool-82"></script>
    <script src="js/works.js?v=20261030-zcool-82"></script>
    <script src="js/site-shell.js?v=20260920-inline-theme"></script>
</body>
</html>
