name: Mirror Works images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-works.yml'
      - 'scripts/mirror-works-images.mjs'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write

concurrency:
  group: mirror-works-images
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install image processor
        run: npm install --no-save sharp
      - name: Mirror Works images into the repository
        run: node scripts/mirror-works-images.mjs
      - name: Commit local assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/works.js data/works.json images/works
          if git diff --cached --quiet; then
            echo "No Works asset changes."
          else
            git commit -m "Mirror Works portfolio images locally"
            git push origin main
          fi
